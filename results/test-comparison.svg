<line x1="36" y1="451" x2="1084" y2="451" stroke="#e2e8f0"/>
<text x="36" y="478" font-size="16" font-weight="700">Vision: 156 errors fixed, 5 new errors.</text>
<text x="36" y="501" font-size="15" fill="#526174">151 more correct names; 44.20% lower CER.</text>
<text x="590" y="478" font-size="16" font-weight="700">Robota: no improvement.</text>
<text x="590" y="501" font-size="15" fill="#526174">The model left all 996 names unchanged.</text>
<text x="36" y="538" font-size="13" fill="#526174">Source: vision-test.json and robota-test.json · Models saved at epoch 9 (Vision) and epoch 2 (Robota)</text>
