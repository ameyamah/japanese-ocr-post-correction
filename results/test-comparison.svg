<text x="68" y="278" text-anchor="end" font-size="13" fill="#526174">60</text>
<line x1="80" y1="229" x2="485" y2="229" stroke="#e2e8f0"/>
<text x="68" y="234" text-anchor="end" font-size="13" fill="#526174">80</text>
<line x1="80" y1="185" x2="485" y2="185" stroke="#e2e8f0"/>
<text x="68" y="190" text-anchor="end" font-size="13" fill="#526174">100</text>
<rect x="117" y="246.6265" width="58" height="158.3735" fill="#c56a13" data-dataset="vision" data-method="baseline" data-metric="exact_match" data-value="0.7198795180722891"><title>Vision OCR text (no correction): 71.99%</title></rect>
<text x="146" y="237.63" text-anchor="middle" font-size="15" font-weight="700">71.99%</text>
<rect x="187" y="213.2731" width="58" height="191.7269" fill="#2563eb" data-dataset="vision" data-method="model" data-metric="exact_match" data-value="0.8714859437751004"><title>Vision T5: 87.15%</title></rect>
<text x="216" y="204.27" text-anchor="middle" font-size="15" font-weight="700">87.15%</text>
