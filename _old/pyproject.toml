[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-text-corrector"
version = "0.1.0"
description = "A Japanese post-OCR correction application"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.11,<3", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
]
[project.optional-dependencies]
inference = ["torch==2.8.0", "transformers==4.57.6", "sentencepiece>=0.2,<0.3"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "pyyaml>=6,<7"]
ml = [
  "torch==2.8.0", "transformers==4.57.6", "sentencepiece>=0.2,<0.3",
  "mlflow>=3.1,<4", "protobuf>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: uses locally installed torch/transformers; no remote downloads"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Reproducible CPU reference environment.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
