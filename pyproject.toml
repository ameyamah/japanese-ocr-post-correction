[project]
name = "japanese-ocr-post-correction"
version = "0.1.0"
description = "Japanese OCR post-correction with T5 and the JaPOC dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=5,<7",
    "rapidfuzz>=3,<4",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
tracking = ["mlflow==3.16.1"]
cpu = ["torch==2.8.0"]
cuda = ["torch==2.8.0"]

# Choose one PyTorch backend. CUDA here targets a Linux NVIDIA environment.
[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", extra = "cpu"},
    {index = "pytorch-cu128", extra = "cuda"},
]
