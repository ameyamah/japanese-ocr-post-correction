[project]
name = "japanese-ocr-post-correction"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11, <3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jupyter",
    "jupyterlab",
    "notebook",
    "pydantic>=2.11,<3",
    "rapidfuzz",
    "sentencepiece",
    "torch>=2.8.0",
    "transformers>=4.57.6",
    "uvicorn>=0.34,<1",
    "rapidfuzz"
]

[project.optional-dependencies]

# Keep your other extras here.
cpu = ["torch==2.8.0"]
cuda = ["torch==2.8.0"]


inference = [
    "sentencepiece>=0.2,<0.3",
    "torch==2.8.0",
    "transformers==4.57.6",
]
ml = [
    "mlflow>=3.1,<4",
    "protobuf>=5,<7",
    "sentencepiece>=0.2,<0.3",
    "torch==2.8.0",
    "transformers==4.57.6",
]
dev = [
    "pytest>=8,<9",
    "pyyaml>=6,<7",
    "ruff>=0.11,<1",
]

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "cuda" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: uses locally installed torch/transformers; no remote downloads"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
