<text x="771" y="295.49" text-anchor="middle" font-size="15" font-weight="700">4.57%</text>
<text x="737" y="430" text-anchor="middle" font-size="16" font-weight="700">Vision</text>
<rect x="874" y="400.3305" width="58" height="4.6695" fill="#c56a13" data-dataset="robota" data-method="baseline" data-metric="cer" data-value="0.002122498483929654"><title>Robota OCR text (no correction): 0.21%</title></rect>
<text x="903" y="391.33" text-anchor="middle" font-size="15" font-weight="700">0.21%</text>
<rect x="944" y="400.3305" width="58" height="4.6695" fill="#2563eb" data-dataset="robota" data-method="model" data-metric="cer" data-value="0.002122498483929654"><title>Robota T5: 0.21%</title></rect>
