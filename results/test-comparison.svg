<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">JaPOC test results: OCR text without correction versus fine-tuned T5</title>
<desc id="desc">996 test samples each for Vision and Robota. Vision exact match improves from 71.99% to 87.15% and CER falls from 8.19% to 4.57%. Robota is unchanged at 98.69% exact match and 0.21% CER. Brown bars use the OCR input directly, without a T5 model. Blue bars use fine-tuned T5. Models were selected using validation, not test scores.</desc>
<rect width="1120" height="560" rx="14" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="36" y="42" font-size="25" font-weight="700">Japanese OCR correction · Test results</text>
<text x="36" y="69" font-size="15" fill="#526174">996 test samples each for Vision and Robota · One T5 model trained for each OCR source</text>
<rect x="36" y="91" width="16" height="16" rx="3" fill="#c56a13"/>
<text x="61" y="104" font-size="14">OCR text (no correction)</text>
<rect x="290" y="91" width="16" height="16" rx="3" fill="#2563eb"/>
<text x="315" y="104" font-size="14">Fine-tuned T5</text>
<text x="54" y="149" font-size="18" font-weight="700">Exact match (%) · Higher is better</text>
