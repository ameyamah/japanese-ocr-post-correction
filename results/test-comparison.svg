<rect x="319" y="187.8715" width="58" height="217.1285" fill="#c56a13" data-dataset="robota" data-method="baseline" data-metric="exact_match" data-value="0.9869477911646586"><title>Robota OCR text (no correction): 98.69%</title></rect>
<text x="348" y="178.87" text-anchor="middle" font-size="15" font-weight="700">98.69%</text>
<rect x="389" y="187.8715" width="58" height="217.1285" fill="#2563eb" data-dataset="robota" data-method="model" data-metric="exact_match" data-value="0.9869477911646586"><title>Robota T5: 98.69%</title></rect>
